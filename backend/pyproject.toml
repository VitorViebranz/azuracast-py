[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azuracast-py"
version = "0.1.0"
description = "AzuraCast-py: Python + React rewrite of AzuraCast"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "aioredis>=2.0.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "mutagen>=1.47.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
]

[project.scripts]
seed = "scripts.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
